spring.application.name=crintx

# Configuración del Servidor
server.port=8080
server.servlet.context-path=/

# Codificación y Formato JSON
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Panama
spring.jackson.default-property-inclusion=non_null

# Configuración de Logging
logging.config=classpath:logback-spring.xml

# Tipo de almacenamiento: 'mongodb' para Mongo Express / MongoDB / Atlas o 'in-memory' para desarrollo local sin BD
app.storage.type=${STORAGE_TYPE:mongodb}

# Configuración de conexión para Mongo Express / MongoDB / Atlas
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/crintx}}
spring.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/crintx}}
spring.data.mongodb.auto-index-creation=${SPRING_DATA_MONGODB_AUTO_INDEX_CREATION:false}

# Texto a voz (Spring AI + ElevenLabs)
# Apagado por defecto: el servidor arranca sin clave. Para activarlo, definir en el
# entorno del servidor (NUNCA en el repositorio):
#   TTS_PROVIDER=elevenlabs
#   ELEVENLABS_API_KEY=<clave>
spring.ai.model.audio.speech=${TTS_PROVIDER:none}
spring.ai.elevenlabs.api-key=${ELEVENLABS_API_KEY:}
spring.ai.elevenlabs.tts.model-id=eleven_multilingual_v2
# Voz "Rachel" (voz prediseñada, disponible en toda cuenta). Cambiable con ELEVENLABS_VOICE_ID.
spring.ai.elevenlabs.tts.voice-id=${ELEVENLABS_VOICE_ID:21m00Tcm4TlvDq8ikWAM}

