spring.application.name=crintx

# Local runs (mvnw spring-boot:run from the repo root) also read secrets from ./.env
# (git-ignored; see .env.example). Optional: ignored when the file isn't there (Docker/ECS).
spring.config.import=optional:file:.env[.properties]

# Configuración del Servidor
server.port=8080
server.servlet.context-path=/

# Codificación y Formato JSON
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Panama
spring.jackson.default-property-inclusion=non_null

# Configuración de Logging
logging.config=classpath:logback-spring.xml

# Tipo de almacenamiento: 'mongodb' para Mongo Express / MongoDB / Atlas o 'in-memory' para desarrollo local sin BD
app.storage.type=${STORAGE_TYPE:mongodb}

# Configuración de conexión para Mongo Express / MongoDB / Atlas
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/crintx}}
spring.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/crintx}}
spring.data.mongodb.auto-index-creation=${SPRING_DATA_MONGODB_AUTO_INDEX_CREATION:false}

# Configuración TTS (ElevenLabs) — modules/tts. La clave va SOLO en el entorno del
# servidor (ECS: Secrets Manager; local: ./.env), nunca en el repositorio.
# Voz por defecto "Sarah" (premade: la aceptan también las cuentas gratuitas).
app.tts.provider=${TTS_PROVIDER:elevenlabs}
app.tts.elevenlabs.api-key=${ELEVENLABS_API_KEY:}
app.tts.elevenlabs.voice-id=${ELEVENLABS_VOICE_ID:EXAVITQu4vr4xnSDxMaL}

